<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawAdopt — Pet Adoption Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="index">
  <header class="navbar">
    <div class="brand">🐾 PawAdopt</div>
    <nav class="nav-links" id="navLinks"></nav>
  </header>

  <main class="container">
    <div id="alertBox" class="alert hidden"></div>

    <section class="hero">
      <div>
        <h1>Find Your New Best Friend</h1>
        <p>Browse available pets, read support updates, or log in to submit an adoption request.</p>
      </div>
    </section>

    <!-- Login & Register Section -->
    <section class="auth-grid" id="authSection">
      <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" required placeholder="e.g. adminmeow" />

          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter password" />

          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>

      <div class="card">
        <h2>Register as Adopter</h2>
        <form id="registerForm">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" required placeholder="Your name" />

          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" required placeholder="Choose a username" />

          <label for="regPhone">Phone</label>
          <input type="text" id="regPhone" placeholder="Optional phone number" />

          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required placeholder="Create password" />

          <button type="submit" class="btn btn-secondary">Create Account</button>
        </form>
      </div>
    </section>

    <!-- Available Pets Catalog -->
    <section class="section">
      <div class="section-header">
        <h2>Available Pets</h2>
      </div>
      <div id="petsContainer" class="cards-grid"></div>
    </section>

    <!-- Support Updates -->
    <section class="section">
      <div class="section-header">
        <h2>Support & Announcements</h2>
      </div>
      <div id="supportContainer" class="stack-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
